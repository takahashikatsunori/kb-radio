name: Daily Kodaira Bousai Radio (Manual Only)

on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付 (YYYY-MM-DD, 空欄の場合は当日の日本時間)'
        required: false
        default: ''
      force_script:
        description: '既存の episode.json がある場合も台本から再生成する'
        type: boolean
        required: false
        default: false
      research_model:
        description: 'Phase A 調査モデル (デフォルト: gemini-4-hydrogen)'
        required: false
        default: 'gemini-4-hydrogen'
      script_model:
        description: 'Phase B 台本執筆モデル (デフォルト: gemini-4-neon)'
        required: false
        default: 'gemini-4-neon'
      factcheck_model:
        description: 'Phase C ファクトチェックモデル (デフォルト: gemini-4-hydrogen)'
        required: false
        default: 'gemini-4-hydrogen'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-radio-pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      already_built: ${{ steps.meta.outputs.already_built }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve JST broadcast date & idempotency check
        id: meta
        run: |
          INPUT_DATE="${{ inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE="$(TZ='Asia/Tokyo' date +%Y-%m-%d)"
          fi
          TARGET_DATE_COMPACT="${TARGET_DATE//-/}"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "target_date_compact=$TARGET_DATE_COMPACT" >> "$GITHUB_OUTPUT"
          echo "Broadcast target date (JST): $TARGET_DATE"

          EP_JSON="episodes/${TARGET_DATE}/episode.json"
          EP_MP3="docs/audio/kodaira_radio_${TARGET_DATE_COMPACT}.mp3"
          if [ "${{ inputs.force_script }}" != "true" ] && [ -f "$EP_JSON" ] && [ -f "$EP_MP3" ]; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
            echo "Episode $TARGET_DATE already exists with audio; skipping rebuild."
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate & fact-check daily script (Hydrogen research + Neon script + Hydrogen fact-check)
        if: steps.meta.outputs.already_built != 'true'
        env:
          PYTHONUTF8: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_script }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          RESEARCH_MODEL="${{ inputs.research_model }}"
          SCRIPT_MODEL="${{ inputs.script_model }}"
          FACTCHECK_MODEL="${{ inputs.factcheck_model }}"
          [ -z "$RESEARCH_MODEL" ] && RESEARCH_MODEL="gemini-4-hydrogen"
          [ -z "$SCRIPT_MODEL" ] && SCRIPT_MODEL="gemini-4-neon"
          [ -z "$FACTCHECK_MODEL" ] && FACTCHECK_MODEL="gemini-4-hydrogen"
          python src/generate_episode.py \
            --date "${{ steps.meta.outputs.target_date }}" \
            --research-model "$RESEARCH_MODEL" \
            --script-model "$SCRIPT_MODEL" \
            --factcheck-model "$FACTCHECK_MODEL" \
            $FORCE_FLAG

      - name: Synthesize audio & master MP3 (Gemini 3.8 Flash TTS)
        if: steps.meta.outputs.already_built != 'true'
        env:
          PYTHONUTF8: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EP_PATH="episodes/${{ steps.meta.outputs.target_date }}/episode.json"
          python src/build_radio.py "$EP_PATH" --tts-engine gemini --bitrate 112k

      - name: Build GitHub Pages portal & script.md
        if: steps.meta.outputs.already_built != 'true'
        env:
          PYTHONUTF8: '1'
        run: |
          python src/build_site.py

      - name: Commit & push new episode and site assets
        if: steps.meta.outputs.already_built != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/ data/knowledge_log.json data/topic_history.json docs/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "radio: broadcast ${{ steps.meta.outputs.target_date }}"
            git pull --rebase
            git push
          else
            echo "No repository changes to commit."
          fi

      - name: Configure GitHub Pages
        if: steps.meta.outputs.already_built != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.meta.outputs.already_built != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.already_built != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
