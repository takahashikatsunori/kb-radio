name: Daily Kodaira Bousai Radio (07:00 JST)

on:
  schedule:
    # 21:35 UTC = 06:35 JST every morning (completes before 07:00 JST)
    - cron: '35 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付 (YYYY-MM-DD, 空欄の場合は当日の日本時間)'
        required: false
        default: ''
      force_script:
        description: '既存の episode.json がある場合も台本から再生成する'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-radio-pages'
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve JST broadcast date
        id: meta
        run: |
          INPUT_DATE="${{ inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE="$(TZ='Asia/Tokyo' date +%Y-%m-%d)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Broadcast target date (JST): $TARGET_DATE"

      - name: Generate daily script (Gemini 3.8 Flash + Search Grounding)
        env:
          PYTHONUTF8: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_script }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python src/generate_episode.py --date "${{ steps.meta.outputs.target_date }}" $FORCE_FLAG

      - name: Synthesize audio & master MP3 (Gemini 3.8 Flash TTS)
        env:
          PYTHONUTF8: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EP_PATH="episodes/${{ steps.meta.outputs.target_date }}/episode.json"
          python src/build_radio.py "$EP_PATH" --tts-engine gemini --bitrate 112k

      - name: Build GitHub Pages portal & script.md
        env:
          PYTHONUTF8: '1'
        run: |
          python src/build_site.py

      - name: Commit & push new episode and site assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/ data/knowledge_log.json docs/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "radio: broadcast ${{ steps.meta.outputs.target_date }}"
            git pull --rebase
            git push
          else
            echo "No repository changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
