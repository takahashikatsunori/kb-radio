<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>バックナンバー一覧 | 毎朝7時！こだいら防災＆まちラジオ</title>
  <style>
    
:root {
  --forest: #1b5e3c;
  --forest-dark: #124028;
  --forest-soft: #e7f4ec;
  --paper: #f8f7f3;
  --card: #ffffff;
  --ink: #1f2937;
  --muted: #5b6472;
  --border: #dfe4de;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --koharu: #e11d48;
  --koharu-soft: #fff1f2;
  --heizo: #2563eb;
  --heizo-soft: #eff6ff;
  --guest: var(--guest-color, #4338ca);
  --guest-soft: var(--guest-bg, #eef2ff);
  --shadow: 0 6px 20px rgba(18, 64, 40, 0.08);
}
* { box-sizing: border-box; }
html, body {
  overflow-x: clip;
  max-width: 100%;
}
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, -apple-system, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.65;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--forest); }

/* Compact app-style header */
header {
  background: linear-gradient(135deg, var(--forest-dark) 0%, var(--forest) 65%, #2b7a50 100%);
  color: #ffffff;
  border-bottom: 3px solid var(--amber);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0.65rem 1rem 0.75rem;
}
.brand-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.55rem;
}
.brand {
  font-weight: 800;
  font-size: clamp(0.98rem, 4vw, 1.22rem);
  color: #fff;
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
}
.time-pill {
  flex: 0 0 auto;
  white-space: nowrap;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.16rem 0.55rem;
  border-radius: 999px;
  background: var(--amber);
  color: #fff;
}
.nav-links {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.32rem;
}
.nav-links a {
  color: rgba(255, 255, 255, 0.94);
  text-decoration: none;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 0.34rem 0.2rem;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background: rgba(255, 255, 255, 0.12);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s;
}
.nav-links a:hover, .nav-links a.active {
  background: #ffffff;
  color: var(--forest-dark);
  border-color: #ffffff;
}
.page-subhead {
  margin: 0.55rem 0 0;
  font-size: 0.82rem;
  color: rgba(255, 255, 255, 0.9);
}
.page-h1 {
  margin: 0.45rem 0 0;
  font-size: clamp(1.08rem, 4vw, 1.45rem);
  line-height: 1.3;
}

/* Main layout */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1rem 1.25rem;
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(310px, 0.95fr);
  gap: 1.25rem;
  align-items: start;
}
.container.single {
  grid-template-columns: minmax(0, 1fr);
}
.col-main, .col-side, .card, .now-playing, .section-head, .seg-divider, .mobile-tabs {
  min-width: 0;
  max-width: 100%;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 1rem;
}
.ep-hero {
  padding: 0.78rem 1rem;
  border-left: 4px solid var(--amber);
}
.ep-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.76rem;
  color: var(--muted);
}
.theme-pill {
  display: inline-block;
  padding: 0.14rem 0.55rem;
  border-radius: 999px;
  background: var(--guest-soft);
  color: var(--guest);
  font-weight: 700;
}
.edition-pill {
  display: inline-block;
  padding: 0.14rem 0.55rem;
  border-radius: 999px;
  background: var(--amber-soft);
  color: #92400e;
  font-weight: 700;
}
.ep-title {
  margin: 0.35rem 0 0;
  font-size: clamp(0.98rem, 3.6vw, 1.22rem);
  line-height: 1.38;
  color: var(--forest-dark);
  overflow-wrap: anywhere;
}
.section-head {
  padding: 0.75rem 1rem;
  background: #fcfcfa;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}
.section-head h2 {
  margin: 0;
  font-size: 0.96rem;
  color: var(--forest-dark);
  min-width: 0;
  overflow-wrap: anywhere;
}
.hint {
  font-size: 0.76rem;
  color: var(--muted);
  flex: 0 0 auto;
}

/* Slim sticky player */
.player-card {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 0.72rem 1rem;
  border-top: 3px solid var(--forest);
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(8px);
}
.audio-pending-banner {
  background: var(--amber-soft);
  border: 1px solid #f59e0b;
  color: #92400e;
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  font-size: 0.8rem;
  margin-bottom: 0.55rem;
}
.now-playing {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}
.now-chapter {
  flex: 1 1 auto;
  font-size: 0.88rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.time-readout {
  font-variant-numeric: tabular-nums;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--heizo);
  white-space: nowrap;
  flex: 0 0 auto;
}
.scrubber {
  width: 100%;
  accent-color: var(--forest);
  cursor: pointer;
  height: 22px;
  margin: 0.2rem 0 0.35rem;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.35rem;
}
.btn-group {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
button {
  font-family: inherit;
  cursor: pointer;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--ink);
  padding: 0.4rem 0.65rem;
  font-size: 0.82rem;
  font-weight: 700;
  min-height: 36px;
  white-space: nowrap;
}
button:hover:not(:disabled) {
  background: var(--forest-soft);
  border-color: var(--forest);
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary {
  background: var(--forest);
  border-color: var(--forest);
  color: #fff;
  padding: 0.42rem 0.95rem;
}
button.primary:hover:not(:disabled) { background: var(--forest-dark); }
button.active-toggle {
  background: var(--heizo-soft);
  border-color: var(--heizo);
  color: var(--heizo);
}
.speed-group button.is-selected {
  background: var(--forest);
  color: #fff;
  border-color: var(--forest);
}
.speed-cycle-btn {
  display: none;
}

/* Mobile 3-tab bar */
.mobile-tabs {
  display: none;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.35rem;
  margin-bottom: 0.75rem;
  background: #ecefe9;
  padding: 0.3rem;
  border-radius: 12px;
}
.mobile-tabs button {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 0.8rem;
  min-height: 36px;
  padding: 0.35rem 0.25rem;
  border-radius: 9px;
}
.mobile-tabs button.active {
  background: #ffffff;
  color: var(--forest-dark);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
}

/* Chapters accordion */
.chapter-summary {
  list-style: none;
  cursor: pointer;
  user-select: none;
}
.chapter-summary::-webkit-details-marker {
  display: none;
}
.chapter-summary .hint::after {
  content: " ▼";
  font-size: 0.7rem;
}
.chapter-details[open] .chapter-summary .hint::after {
  content: " ▲";
}
.chapter-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 0.45rem;
  padding: 0.75rem 0.95rem;
}
.chapter-btn {
  text-align: left;
  padding: 0.5rem 0.65rem;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 0.14rem;
  white-space: normal;
  min-height: auto;
}
.chapter-btn.active {
  background: var(--forest-soft);
  border-color: var(--forest);
  box-shadow: inset 3px 0 0 var(--forest);
}
.chapter-tc {
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
  color: var(--heizo);
  font-weight: 700;
  flex: 0 0 auto;
}
.chapter-title {
  font-size: 0.82rem;
  line-height: 1.35;
  min-width: 0;
  overflow-wrap: anywhere;
}

/* Transcript */
.transcript-body {
  padding: 0.8rem 0.95rem 1.25rem;
  max-height: 68vh;
  overflow-y: auto;
}
.seg-divider {
  margin: 1rem 0 0.55rem;
  padding: 0.42rem 0.7rem;
  background: var(--forest-soft);
  border-left: 4px solid var(--forest);
  border-radius: 6px;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--forest-dark);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.4rem;
  scroll-margin-top: 150px;
}
.seg-divider > span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.seg-divider:first-child { margin-top: 0; }
.line-item {
  display: grid;
  grid-template-columns: 48px 86px minmax(0, 1fr);
  grid-template-areas: "tc speaker text";
  gap: 0.5rem;
  padding: 0.52rem 0.6rem;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
  align-items: baseline;
  scroll-margin-top: 150px;
}
.line-item:hover { background: #f3f5f2; }
.line-item.active {
  background: var(--amber-soft);
  border-color: #f59e0b;
}
.line-tc {
  grid-area: tc;
  font-variant-numeric: tabular-nums;
  font-size: 0.76rem;
  color: var(--muted);
  font-weight: 600;
}
.speaker-pill {
  grid-area: speaker;
  font-size: 0.74rem;
  font-weight: 700;
  text-align: center;
  padding: 0.14rem 0.48rem;
  border-radius: 999px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.speaker-koharu { background: var(--koharu-soft); color: var(--koharu); }
.speaker-heizo { background: var(--heizo-soft); color: var(--heizo); }
.speaker-guest { background: var(--guest-soft); color: var(--guest); }
.line-text {
  grid-area: text;
  font-size: 0.94rem;
  overflow-wrap: anywhere;
}

/* Right panels & cards */
.panel-body {
  padding: 0.8rem 0.95rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.link-card {
  display: block;
  text-decoration: none;
  color: inherit;
  padding: 0.72rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fcfcfa;
  transition: border-color 0.15s, background 0.15s;
}
.link-card:hover {
  border-color: var(--forest);
  background: var(--forest-soft);
}
.pill-tag {
  display: inline-block;
  font-size: 0.71rem;
  font-weight: 700;
  padding: 0.1rem 0.48rem;
  border-radius: 999px;
  background: var(--forest-soft);
  color: var(--forest-dark);
  margin-bottom: 0.22rem;
}
.link-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--forest-dark);
  margin: 0 0 0.18rem;
  overflow-wrap: anywhere;
}
.link-note {
  font-size: 0.8rem;
  color: var(--muted);
  margin: 0;
  overflow-wrap: anywhere;
}
.note-box {
  padding: 0.72rem 0.85rem;
  border-radius: 10px;
  background: #fcfcfa;
  border: 1px solid var(--border);
  font-size: 0.86rem;
  overflow-wrap: anywhere;
}
.note-box ul {
  margin: 0.35rem 0 0.45rem;
  padding-left: 1.15rem;
}
.tel-link {
  color: var(--heizo);
  font-weight: 700;
  text-decoration: underline;
}
.guest-card {
  padding: 0.8rem 0.95rem;
  border-left: 4px solid var(--guest);
  background: var(--guest-soft);
  border-radius: 10px;
}
.kw-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.45rem;
}
.kw-chip {
  font-size: 0.74rem;
  background: #fff;
  border: 1px solid var(--border);
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  font-weight: 600;
}
.archive-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 0.85rem;
  padding: 0.9rem;
}
.archive-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.9rem;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  overflow-wrap: anywhere;
}
.btn-link {
  display: inline-block;
  text-decoration: none;
  background: var(--forest);
  color: #fff;
  font-size: 0.84rem;
  font-weight: 700;
  padding: 0.48rem 0.85rem;
  border-radius: 8px;
  text-align: center;
}
.btn-link:hover { background: var(--forest-dark); }
footer {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0.9rem 1rem 2rem;
  font-size: 0.78rem;
  color: var(--muted);
  text-align: center;
}

/* Mobile breakpoint (<= 920px): single column + tab switching */
@media (max-width: 920px) {
  .container {
    display: block;
    width: 100%;
    padding: 0.65rem 0.7rem;
  }
  .mobile-tabs {
    display: grid;
  }
  .player-card {
    margin: 0 0 0.65rem;
    border-radius: 12px;
    padding: 0.6rem 0.78rem;
  }
  main[data-active-tab="script"] #tab-panel-script { display: block; }
  main[data-active-tab="script"] .col-side { display: none; }

  main[data-active-tab="links"] #tab-panel-script { display: none; }
  main[data-active-tab="links"] .col-side { display: block; }
  main[data-active-tab="links"] #tab-panel-links { display: block; }
  main[data-active-tab="links"] #tab-panel-notes { display: none; }

  main[data-active-tab="notes"] #tab-panel-script { display: none; }
  main[data-active-tab="notes"] .col-side { display: block; }
  main[data-active-tab="notes"] #tab-panel-links { display: none; }
  main[data-active-tab="notes"] #tab-panel-notes { display: block; }
}

/* Narrow phone breakpoint (<= 640px): vertical-only controls, accordion chapters, 2-row transcript */
@media (max-width: 640px) {
  .header-inner { padding: 0.55rem 0.7rem 0.62rem; }
  .brand-bar { margin-bottom: 0.45rem; }
  .nav-links { gap: 0.25rem; }
  .nav-links a { font-size: 0.72rem; padding: 0.34rem 0.14rem; }
  .ep-hero { padding: 0.62rem 0.75rem; margin-bottom: 0.6rem; }
  .controls { gap: 0.25rem; }
  .btn-group { gap: 0.25rem; }
  .speed-group { display: none; }
  .speed-cycle-btn { display: inline-flex; align-items: center; }
  button { padding: 0.34rem 0.48rem; font-size: 0.76rem; min-height: 36px; }
  button.primary { padding: 0.34rem 0.68rem; }

  .chapter-list {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    padding: 0.6rem 0.75rem;
    gap: 0.38rem;
  }
  .chapter-btn {
    flex-direction: row;
    align-items: baseline;
    gap: 0.45rem;
    width: 100%;
    padding: 0.48rem 0.62rem;
  }
  .chapter-tc {
    flex: 0 0 auto;
  }

  .transcript-body {
    max-height: none;
    overflow-y: visible;
    padding: 0.65rem 0.75rem 1.2rem;
  }
  .line-item {
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas:
      "speaker tc"
      "text text";
    gap: 0.28rem 0.55rem;
    padding: 0.55rem 0.55rem;
    border-bottom: 1px solid #f0f2ee;
  }
  .line-tc {
    justify-self: end;
    font-size: 0.74rem;
  }
  .line-text {
    font-size: 0.95rem;
    line-height: 1.72;
  }
}

    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: #fcfcfa;
    }
    .search-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 16px;
      font-family: inherit;
    }
    .day-pills {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem;
    }
    .day-pills button {
      width: 100%;
      padding: 0.38rem 0.2rem;
    }
    .day-pills button.active {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-bar"><a class="brand" href="index.html">こだいら防災＆まちラジオ</a><span class="time-pill">毎朝7時</span></div><nav class="nav-links" aria-label="メインメニュー"><a href="index.html">最新回</a><a href="archive.html" class="active">過去回</a><a href="cast.html">出演者</a><a href="characters.html">防災ノート</a></nav><h1 class="page-h1">バックナンバー</h1><p class="page-subhead">これまでの放送をいつでも聴く・読むことができます</p>
    </div>
  </header>

  <main class="container single">
    <div class="card">
      <div class="filter-bar">
        <input type="search" id="search-input" class="search-input" placeholder="キーワード検索（例：GIS、小川パレット、星野…）" />
        <div class="day-pills" id="day-pills">
          <button type="button" data-day="all" class="active">すべて</button>
          <button type="button" data-day="monday">月</button>
          <button type="button" data-day="tuesday">火</button>
          <button type="button" data-day="wednesday">水</button>
          <button type="button" data-day="thursday">木</button>
          <button type="button" data-day="friday">金</button>
          <button type="button" data-day="saturday">土</button>
          <button type="button" data-day="sunday">日</button>
        </div>
      </div>
      <div class="archive-grid" id="archive-grid"></div>
    </div>

  <script>
    (function () {
      const items = JSON.parse(document.getElementById("archive-data").textContent);
      const grid = document.getElementById("archive-grid");
      const searchInput = document.getElementById("search-input");
      const dayButtons = Array.from(document.querySelectorAll("#day-pills button"));
      let selectedDay = "all";

      function render() {
        const q = (searchInput.value || "").trim().toLowerCase();
        grid.innerHTML = "";
        const filtered = items.filter((it) => {
          if (selectedDay !== "all" && it.weekday !== selectedDay) return false;
          if (!q) return true;
          const hay = [
            it.date, it.theme_name, it.subtitle, it.guest_name,
            ...(it.keywords || []), ...(it.learned_points || [])
          ].join(" ").toLowerCase();
          return hay.includes(q);
        });
        if (filtered.length === 0) {
          const empty = document.createElement("p");
          empty.style.color = "var(--muted)";
          empty.textContent = "条件に一致するバックナンバーが見つかりませんでした。";
          grid.appendChild(empty);
          return;
        }
        filtered.forEach((it) => {
          const card = document.createElement("article");
          card.className = "archive-card";
          const tag = document.createElement("span");
          tag.className = "pill-tag";
          tag.textContent = it.episode_label + " ・ " + it.date + "（" + it.weekday_ja + "）";
          card.appendChild(tag);
          if (it.is_holiday || it.special_title || it.is_spinoff) {
            const ed = document.createElement("span");
            ed.className = "edition-pill";
            ed.style.fontSize = "0.72rem";
            ed.textContent = it.special_title ? (it.edition_label + " ／ " + it.special_title) : it.edition_label;
            card.appendChild(ed);
          }
          const h3 = document.createElement("h3");
          h3.style.margin = "0.2rem 0";
          h3.style.fontSize = "1rem";
          h3.textContent = it.theme_name;
          const sub = document.createElement("div");
          sub.style.fontSize = "0.84rem";
          sub.style.color = "var(--muted)";
          sub.textContent = it.subtitle;
          const g = document.createElement("div");
          g.style.fontSize = "0.82rem";
          g.textContent = (it.guest_name ? ("ゲスト: " + it.guest_name) : "小春＆平蔵スペシャル") + " ／ " + it.duration + (it.has_audio ? "（音声あり）" : "（台本）");
          const btn = document.createElement("a");
          btn.className = "btn-link";
          btn.href = it.href;
          btn.textContent = "この回を聴く・台本を読む →";
          card.appendChild(h3);
          card.appendChild(sub);
          card.appendChild(g);
          card.appendChild(btn);
          grid.appendChild(card);
        });
      }

      searchInput.addEventListener("input", render);
      dayButtons.forEach((b) => {
        b.addEventListener("click", () => {
          selectedDay = b.dataset.day || "all";
          dayButtons.forEach((x) => x.classList.toggle("active", x === b));
          render();
        });
      });
      render();
    })();
  </script>
